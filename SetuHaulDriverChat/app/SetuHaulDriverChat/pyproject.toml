[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SetuHaulDriverChat"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain/LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "opentelemetry-instrumentation-langchain >= 0.59.0",
    "langchain >= 1.0.3",
    "bedrock-agentcore >= 1.8.0",
    "botocore[crt] >= 1.35.0",
    # The actual, currently-live tool-calling model (tasks #136/#137 in repo
    # history swapped this app off Gemini/Claude onto an open-weights model
    # served via Hugging Face Inference Providers -- see
    # backend/driver_chat_eta/llm/agent.py's is_configured()/_run_chat_turn,
    # which this container's main.py calls directly). Without this
    # dependency, run_chat_turn's `from langchain_huggingface import
    # ChatHuggingFace, HuggingFaceEndpoint` raises ImportError at runtime,
    # main.py's broad except swallows it, and every driver message silently
    # falls back to the deterministic regex parser -- i.e. this container
    # would deploy successfully but never actually run the LLM.
    "langchain-huggingface >= 1.2",
    # Gemini is kept only because backend/driver_chat_eta/llm/agent.py's
    # transcribe_audio() imports langchain_google_genai -- NOT used by this
    # container's entrypoint (voice-note transcription is a Vercel/FastAPI
    # concern, agentcore_app never calls transcribe_audio), but left in so
    # the vendored setuhaul/ package's imports resolve identically to the
    # main repo either way.
    "langchain-google-genai >= 3.0.3",
    "google-genai >= 1.0.0, < 2.0.0",
    # Below: same runtime deps setuhaul/ (vendored copy of src/setuhaul, see
    # main.py's docstring) needs to actually run -- kept in sync with the
    # versions pinned in the repo root's pyproject.toml so behavior doesn't
    # drift between the Vercel and AWS deployments.
    "supabase==2.31.0",
    "redis>=5.0",
    "pydantic>=2.0",
    "pydantic-settings==2.14.2",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
