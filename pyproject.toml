[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "setuhaul-exception-agent"
version = "0.1.0"
description = "Deterministic dock rescheduling engine for the SetuHaul FDE challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pydantic-settings==2.14.2",
    "python-dotenv>=1.0",
    "supabase==2.31.0",
    "uvicorn>=0.30",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "redis>=5.0",
    "twilio>=9.0",
    "openpyxl>=3.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "langsmith>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "locust>=2.31"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/setuhaul/backend/tms/tests"]
