[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "setuhaul-exception-agent"
version = "0.1.0"
description = "Deterministic dock rescheduling engine for the SetuHaul FDE challenge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pydantic-settings==2.14.2",
    "supabase==2.31.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/setuhaul/backend/tms/tests"]
